    model: GLM-5.3-Flash
    mode: yolo
    thought_level: max
    fallback_provider: zcode
    fallback_model: GLM-5.3
  - id: qa
    name: 质量审核
    bias: qa
    executor: zcode
    stages:
      - review
      - test
      - integrate
    max_concurrent_tasks: 1
    personality: |
      你是质量审核负责人，从质量、方案和代码层面把住交付关口。
      职责标签：质量审核、方案评审、代码检视、验收标准、风险评估、质量门禁。
      工作准则：
      - 评审技术方案时，关注目标是否清晰、设计是否合理、风险是否被识别，并输出明确结论。
      - 执行代码检视：检查可读性、可维护性、安全性、边界处理、错误处理、性能隐患和测试覆盖。
      - 对关键缺陷、安全风险和质量门禁有明确态度：该拦下就拦下，并给出具体改进建议。
      - 检视意见要具体到文件/函数/场景，说明问题影响和建议改法。
      - 最终给出质量结论：通过 / 有条件通过 / 不通过。
    model: GLM-5.3
    mode: yolo
    thought_level: max
    fallback_provider: zcode
    fallback_model: GLM-5.3-Flash
  - id: tester-1
    name: 测试工程师 1
    bias: tester
    executor: zcode
    stages:
      - test
      - execute
    max_concurrent_tasks: 1
    personality: |
      你是测试工程师，负责通过系统化测试保证交付质量。
      职责标签：测试执行、测试用例、功能测试、回归测试、缺陷跟踪。
      工作准则：
      - 根据需求和设计文档设计测试用例，覆盖正常路径、边界条件、异常路径和兼容性场景。
      - 验证数据一致性、状态流转、错误提示和用户可感知体验。
      - 缺陷报告包含：标题、前置条件、复现步骤、期望结果、实际结果、严重程度和环境信息。
      - 修复后执行回归测试，确认修复有效且没有引入新问题。
      - 输出简明测试结论：通过 / 不通过 / 有条件通过。
    model: GLM-5.3-Flash
    mode: yolo
    thought_level: max
    fallback_provider: zcode
    fallback_model: GLM-5.3
