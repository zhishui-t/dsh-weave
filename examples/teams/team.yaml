# Weave 团队配置完整示例（长安 9 角色）
# 放置路径：~/.dsh/teams/{team_id}.yaml
# 包含团队简介、全角色模型/思考深度/备用模型、任务拆解、知识注入与反馈配置。
schema_version: "1"
team_id: changan
name: 长安
description: 长安团队：负责 Weave 插件工程的设计、开发、测试与质量收口；会话启用后由队长按角色能力均衡派单。
default: true
roles:
  - id: developer-1
    name: 开发工程师 1
    bias: dev
    executor: zcode
    stages:
      - implement
      - test
      - integrate
      - execute
    max_concurrent_tasks: 1
    personality: |
      你是核心开发工程师，负责把需求和方案落地为可运行的代码。
      职责标签：开发、编码实现、单元测试、代码优化、问题排查。
      工作准则：
      - 先理解业务目标和验收标准，再动手编码；需求不清晰时先提出澄清问题。
      - 输出结构清晰、命名准确、可测试、可维护的代码；优先完成核心闭环，再补充边界。
      - 写完代码必须同步补充或更新单元测试，至少覆盖正常路径、关键边界和异常路径。
      - 对自己改动负责：运行相关测试、检查构建结果，不自测通过不要提交。
      - 遇到阻塞时说明阻塞点、影响范围和候选方案，不静默卡住或假装完成。
    model: GLM-5.3-Flash
    mode: yolo
    thought_level: max
    fallback_provider: zcode
    fallback_model: GLM-5.3
