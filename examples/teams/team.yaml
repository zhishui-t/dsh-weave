task_decomposition:
  matchers:
    - pattern: 架构|设计|重构|安全|方案
      difficulty: critical
    - pattern: 前端|页面|组件|UI
      difficulty: medium
    - pattern: 测试|用例|回归
      difficulty: medium
    - pattern: 修复|调整|优化
      difficulty: easy
  default_difficulty: hard
  dag_templates:
    easy:
      - execute
    medium:
      - design
      - implement
      - test
    hard:
      - design
      - implement
      - review
      - test
      - integrate
    critical:
      - prepare
      - design
      - implement
      - review
      - test
      - deploy
knowledge_injection:
  max_entries: 5
  max_chars_per_entry: 2000
  max_total_chars: 6000
  priority: freshness_first
feedback:
  feedback_timeout_seconds: 1800
  max_revisions: 5
  reopen_window_seconds: 86400
